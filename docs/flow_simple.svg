<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="1180" fill="#0b0f1a"/>
  <text x="450" y="44" fill="#22d3ee" font-size="26" font-weight="bold" text-anchor="middle">How SOCShield Works — Simple Flow</text>
  <text x="450" y="72" fill="#9ca3af" font-size="14" text-anchor="middle">Follow one attack from the network to the analyst's screen</text>

  <defs>
    <marker id="arw" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#22d3ee"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- STEP 1 -->
  <g filter="url(#sh)">
    <rect x="250" y="100" width="400" height="78" rx="12" fill="#1e293b" stroke="#334155"/>
  </g>
  <circle cx="290" cy="139" r="20" fill="#f59e0b"/><text x="290" y="146" fill="#0b0f1a" font-size="20" font-weight="bold" text-anchor="middle">1</text>
  <text x="325" y="132" fill="#fff" font-size="17" font-weight="bold">Attack happens on the network</text>
  <text x="325" y="156" fill="#9ca3af" font-size="13">Suricata (the sensor) spots it and writes an alert</text>
  <line x1="450" y1="178" x2="450" y2="208" stroke="#22d3ee" stroke-width="3" marker-end="url(#arw)"/>

  <!-- STEP 2 -->
  <g filter="url(#sh)"><rect x="250" y="210" width="400" height="78" rx="12" fill="#1e293b" stroke="#334155"/></g>
  <circle cx="290" cy="249" r="20" fill="#f59e0b"/><text x="290" y="256" fill="#0b0f1a" font-size="20" font-weight="bold" text-anchor="middle">2</text>
  <text x="325" y="242" fill="#fff" font-size="17" font-weight="bold">Agent sends the alert</text>
  <text x="325" y="266" fill="#9ca3af" font-size="13">agent.py forwards it to the backend over the network</text>
  <line x1="450" y1="288" x2="450" y2="318" stroke="#22d3ee" stroke-width="3" marker-end="url(#arw)"/>

  <!-- STEP 3 -->
  <g filter="url(#sh)"><rect x="250" y="320" width="400" height="78" rx="12" fill="#1e293b" stroke="#334155"/></g>
  <circle cx="290" cy="359" r="20" fill="#0ea5e9"/><text x="290" y="366" fill="#0b0f1a" font-size="20" font-weight="bold" text-anchor="middle">3</text>
  <text x="325" y="352" fill="#fff" font-size="17" font-weight="bold">Clean up &amp; check for duplicates</text>
  <text x="325" y="376" fill="#9ca3af" font-size="13">Backend tidies the data; ignores repeats</text>
  <line x1="450" y1="398" x2="450" y2="428" stroke="#22d3ee" stroke-width="3" marker-end="url(#arw)"/>

  <!-- STEP 4 — the brain (3 parallel) -->
  <g filter="url(#sh)"><rect x="120" y="430" width="660" height="150" rx="12" fill="#0f1b2d" stroke="#0ea5e9"/></g>
  <circle cx="160" cy="469" r="20" fill="#0ea5e9"/><text x="160" y="476" fill="#0b0f1a" font-size="20" font-weight="bold" text-anchor="middle">4</text>
  <text x="195" y="469" fill="#fff" font-size="17" font-weight="bold">The "brain" studies the alert</text>
  <text x="195" y="490" fill="#9ca3af" font-size="12.5">Three checks run, then combine into one score</text>

  <rect x="140" y="506" width="200" height="58" rx="8" fill="#1e293b"/>
  <text x="240" y="530" fill="#22d3ee" font-size="13" font-weight="bold" text-anchor="middle">🧠 What kind?</text>
  <text x="240" y="550" fill="#9ca3af" font-size="11.5" text-anchor="middle">ML names the attack type</text>

  <rect x="350" y="506" width="200" height="58" rx="8" fill="#1e293b"/>
  <text x="450" y="530" fill="#22d3ee" font-size="13" font-weight="bold" text-anchor="middle">🌀 How unusual?</text>
  <text x="450" y="550" fill="#9ca3af" font-size="11.5" text-anchor="middle">Anomaly score on traffic</text>

  <rect x="560" y="506" width="200" height="58" rx="8" fill="#1e293b"/>
  <text x="660" y="530" fill="#22d3ee" font-size="13" font-weight="bold" text-anchor="middle">⚖ How risky?</text>
  <text x="660" y="550" fill="#9ca3af" font-size="11.5" text-anchor="middle">Risk engine sets priority</text>
  <line x1="450" y1="580" x2="450" y2="610" stroke="#22d3ee" stroke-width="3" marker-end="url(#arw)"/>

  <!-- STEP 5 -->
  <g filter="url(#sh)"><rect x="250" y="612" width="400" height="78" rx="12" fill="#1e293b" stroke="#334155"/></g>
  <circle cx="290" cy="651" r="20" fill="#15803d"/><text x="290" y="658" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">5</text>
  <text x="325" y="644" fill="#fff" font-size="17" font-weight="bold">Save it &amp; score it</text>
  <text x="325" y="668" fill="#9ca3af" font-size="13">Stored in MongoDB with a Low→Critical priority</text>
  <line x1="450" y1="690" x2="450" y2="720" stroke="#22d3ee" stroke-width="3" marker-end="url(#arw)"/>

  <!-- STEP 6 — branch: auto response -->
  <g filter="url(#sh)"><rect x="250" y="722" width="400" height="88" rx="12" fill="#1e293b" stroke="#334155"/></g>
  <circle cx="290" cy="766" r="20" fill="#b45309"/><text x="290" y="773" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">6</text>
  <text x="325" y="755" fill="#fff" font-size="17" font-weight="bold">If dangerous → act automatically</text>
  <text x="325" y="778" fill="#9ca3af" font-size="13">Send Telegram alert &amp; (optionally) block the IP</text>
  <text x="325" y="797" fill="#64748b" font-size="11.5">Only for High / Critical — blocking is off by default</text>
  <line x1="450" y1="810" x2="450" y2="840" stroke="#22d3ee" stroke-width="3" marker-end="url(#arw)"/>

  <!-- STEP 7 -->
  <g filter="url(#sh)"><rect x="250" y="842" width="400" height="78" rx="12" fill="#1e293b" stroke="#334155"/></g>
  <circle cx="290" cy="881" r="20" fill="#0ea5e9"/><text x="290" y="888" fill="#0b0f1a" font-size="20" font-weight="bold" text-anchor="middle">7</text>
  <text x="325" y="874" fill="#fff" font-size="17" font-weight="bold">Show it on the dashboard</text>
  <text x="325" y="898" fill="#9ca3af" font-size="13">Live cards, charts, map — updates in real time</text>
  <line x1="450" y1="920" x2="450" y2="950" stroke="#22d3ee" stroke-width="3" marker-end="url(#arw)"/>

  <!-- STEP 8 -->
  <g filter="url(#sh)"><rect x="250" y="952" width="400" height="92" rx="12" fill="#1e293b" stroke="#334155"/></g>
  <circle cx="290" cy="998" r="20" fill="#d7263d"/><text x="290" y="1005" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">8</text>
  <text x="325" y="985" fill="#fff" font-size="17" font-weight="bold">Analyst investigates &amp; closes</text>
  <text x="325" y="1008" fill="#9ca3af" font-size="13">Reads the AI summary, assigns, resolves, or blocks</text>
  <text x="325" y="1027" fill="#64748b" font-size="11.5">Login required — roles: viewer / analyst / admin</text>

  <!-- Footer legend -->
  <rect x="120" y="1075" width="660" height="70" rx="10" fill="#0f1b2d" stroke="#1f2937"/>
  <text x="140" y="1100" fill="#9ca3af" font-size="13"><tspan fill="#f59e0b" font-weight="bold">Agent</tspan>  collects  →  <tspan fill="#0ea5e9" font-weight="bold">Backend</tspan>  thinks  →  <tspan fill="#15803d" font-weight="bold">Database</tspan>  remembers  →  <tspan fill="#d7263d" font-weight="bold">Dashboard</tspan>  shows</text>
  <text x="140" y="1126" fill="#64748b" font-size="12">In one line: catch the attack, understand it, score it, react, and show the analyst what to do.</text>
</svg>

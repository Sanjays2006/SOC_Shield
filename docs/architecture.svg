<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#0b0f1a"/>
  <text x="480" y="36" fill="#22d3ee" font-size="24" font-weight="bold" text-anchor="middle">SOCShield — AI/ML-Powered IDS Alert Intelligence Platform</text>
  <text x="480" y="58" fill="#9ca3af" font-size="13" text-anchor="middle">Four-layer architecture · data flows top → bottom, APIs return bottom → top</text>

  <!-- Layer 1: Agent -->
  <rect x="40" y="80" width="880" height="96" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="56" y="104" fill="#f59e0b" font-size="14" font-weight="bold">LAYER 1 — AGENT</text>
  <rect x="60" y="112" width="200" height="52" rx="6" fill="#1f2937"/><text x="160" y="134" fill="#e5e7eb" font-size="12" text-anchor="middle">Suricata IDS</text><text x="160" y="152" fill="#9ca3af" font-size="11" text-anchor="middle">eve.json (live/file)</text>
  <rect x="280" y="112" width="200" height="52" rx="6" fill="#1f2937"/><text x="380" y="134" fill="#e5e7eb" font-size="12" text-anchor="middle">agent.py</text><text x="380" y="152" fill="#9ca3af" font-size="11" text-anchor="middle">read / simulate · POST</text>
  <rect x="500" y="112" width="200" height="52" rx="6" fill="#1f2937"/><text x="600" y="134" fill="#e5e7eb" font-size="12" text-anchor="middle">Simulation mode</text><text x="600" y="152" fill="#9ca3af" font-size="11" text-anchor="middle">multi-field EVE events</text>
  <rect x="720" y="112" width="180" height="52" rx="6" fill="#1f2937"/><text x="810" y="134" fill="#e5e7eb" font-size="12" text-anchor="middle">env config</text><text x="810" y="152" fill="#9ca3af" font-size="11" text-anchor="middle">no hard-coded paths</text>

  <!-- arrow -->
  <line x1="480" y1="176" x2="480" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <text x="498" y="194" fill="#9ca3af" font-size="11">POST /ingest (JSON)</text>

  <!-- Layer 2: Backend -->
  <rect x="40" y="204" width="880" height="196" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="56" y="228" fill="#f59e0b" font-size="14" font-weight="bold">LAYER 2 — BACKEND &amp; INTELLIGENCE  (Flask app factory + blueprints + services)</text>

  <rect x="60" y="240" width="180" height="60" rx="6" fill="#1f2937"/><text x="150" y="262" fill="#e5e7eb" font-size="12" text-anchor="middle">normalize + dedup</text><text x="150" y="280" fill="#9ca3af" font-size="11" text-anchor="middle">EVE/legacy → schema</text><text x="150" y="294" fill="#9ca3af" font-size="11" text-anchor="middle">event_hash</text>

  <rect x="252" y="240" width="180" height="60" rx="6" fill="#1f2937"/><text x="342" y="262" fill="#e5e7eb" font-size="12" text-anchor="middle">ML classifier</text><text x="342" y="280" fill="#9ca3af" font-size="11" text-anchor="middle">RandomForest</text><text x="342" y="294" fill="#9ca3af" font-size="11" text-anchor="middle">attack family</text>

  <rect x="444" y="240" width="180" height="60" rx="6" fill="#1f2937"/><text x="534" y="262" fill="#e5e7eb" font-size="12" text-anchor="middle">anomaly detector</text><text x="534" y="280" fill="#9ca3af" font-size="11" text-anchor="middle">IsolationForest</text><text x="534" y="294" fill="#9ca3af" font-size="11" text-anchor="middle">flow features</text>

  <rect x="636" y="240" width="180" height="60" rx="6" fill="#1f2937"/><text x="726" y="262" fill="#e5e7eb" font-size="12" text-anchor="middle">risk engine</text><text x="726" y="280" fill="#9ca3af" font-size="11" text-anchor="middle">weighted · no</text><text x="726" y="294" fill="#9ca3af" font-size="11" text-anchor="middle">double-count</text>

  <rect x="828" y="240" width="72" height="60" rx="6" fill="#1f2937"/><text x="864" y="266" fill="#e5e7eb" font-size="11" text-anchor="middle">LLM</text><text x="864" y="282" fill="#9ca3af" font-size="10" text-anchor="middle">summary</text><text x="864" y="294" fill="#9ca3af" font-size="10" text-anchor="middle">+fallback</text>

  <rect x="60" y="316" width="370" height="68" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="245" y="338" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="bold">REST APIs (blueprints)</text>
  <text x="245" y="356" fill="#9ca3af" font-size="10.5" text-anchor="middle">/ingest /logs /alerts /stats /ml/* /ip-intel</text>
  <text x="245" y="372" fill="#9ca3af" font-size="10.5" text-anchor="middle">/incident-summary /block-ip /blocked-ips /attack-chain</text>

  <rect x="446" y="316" width="370" height="68" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="631" y="338" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="bold">cross-cutting</text>
  <text x="631" y="356" fill="#9ca3af" font-size="10.5" text-anchor="middle">env config · CORS allowlist · input validation</text>
  <text x="631" y="372" fill="#9ca3af" font-size="10.5" text-anchor="middle">Socket.IO (new_log/new_alert) · generic error handler</text>

  <!-- arrows to data + frontend -->
  <line x1="300" y1="400" x2="300" y2="432" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <text x="318" y="420" fill="#9ca3af" font-size="11">persist</text>
  <line x1="660" y1="432" x2="660" y2="400" stroke="#34d399" stroke-width="2" marker-end="url(#a)"/>
  <text x="676" y="420" fill="#9ca3af" font-size="11">query</text>

  <!-- Layer 4: Data -->
  <rect x="40" y="436" width="880" height="80" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="56" y="460" fill="#f59e0b" font-size="14" font-weight="bold">LAYER 4 — DATA  (MongoDB · indexes · timestamps · dedup)</text>
  <rect x="60" y="470" width="260" height="34" rx="6" fill="#1f2937"/><text x="190" y="492" fill="#e5e7eb" font-size="11" text-anchor="middle">logs (raw + normalized + event_hash)</text>
  <rect x="340" y="470" width="260" height="34" rx="6" fill="#1f2937"/><text x="470" y="492" fill="#e5e7eb" font-size="11" text-anchor="middle">alerts (score · ml · risk · priority)</text>
  <rect x="620" y="470" width="280" height="34" rx="6" fill="#1f2937"/><text x="760" y="492" fill="#e5e7eb" font-size="11" text-anchor="middle">blocked_ips (unique) · model reports</text>

  <!-- Layer 3: Frontend (right column, spanning) -->
  <line x1="480" y1="400" x2="480" y2="548" stroke="#1f2937" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="40" y="536" width="880" height="68" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="56" y="560" fill="#f59e0b" font-size="14" font-weight="bold">LAYER 3 — FRONTEND  (React + Vite · polling + Socket.IO)</text>
  <text x="56" y="582" fill="#9ca3af" font-size="11">Overview cards · severity/risk charts · alert cards (ML+risk) · filters/search/sort/pagination · investigation drawer + AI summary</text>
  <text x="56" y="598" fill="#9ca3af" font-size="11">map · attack chain · IP intel · PCAP analyzer · loading / empty / error states — all on real backend data</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
</svg>
